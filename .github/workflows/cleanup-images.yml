name: Limpiar imágenes

on:
  schedule:
    - cron: "0 9 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Vaciar carpeta images
        run: |
          find images -type f ! -name '.gitkeep' -delete

      - name: Guardar limpieza
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No hay imágenes que eliminar"
          else
            git commit -m "Limpieza automática de imágenes"
            git push
          fi
